[project]
name = "wp_chariot"
version = "0.1.0"
description = "Herramientas de despliegue para WordPress"
readme = "../README.md"
requires-python = ">=3.8"
authors = [
    {name = "Victor Gonzalez", email = "victor@ttamayo.com"}
]
keywords = ["wordpress", "deployment", "tools"]
dependencies = [
    "python-dotenv>=0.19.0",
    "click>=8.0.0",
    "paramiko>=2.10.0",
    "rich>=12.0.0",
    "mysql-connector-python>=8.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.64.0",
]

[project.scripts]
wp_chariot = "cli:main"
wpchariot = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commands", "utils", "sync"]

[dependency-groups]
dev = []

